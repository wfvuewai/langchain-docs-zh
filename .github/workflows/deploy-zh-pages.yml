---
name: Deploy Chinese Docs for Mintlify Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Build Chinese docs (pipeline + Chinese content)
        run: uv run python scripts/build_zh.py

      - name: Verify build output exists
        run: |
          if [ ! -d build ]; then
            echo "Error: build/ directory was not created."
            exit 1
          fi
          echo "Build files: $(find build -type f | wc -l)"

      - name: Publish to zh-prod branch for Mintlify Cloud
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: zh-prod
