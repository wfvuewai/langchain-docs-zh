---
name: Deploy Chinese Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Build Chinese docs
        run: |
          mkdir -p deploy-site
          uv run python scripts/build_zh.py
          cp -r build/zh deploy-site/zh
          cp -r build/images deploy-site/images
          cp -r build/fonts deploy-site/fonts
          cp build/docs.json deploy-site/ 2>/dev/null || true

      - name: Start Mintlify server and capture
        timeout-minutes: 20
        run: |
          cd build
          mint dev --port 3456 &
          MINT_PID=$!
          echo "Server PID: $MINT_PID, waiting up to 120s..."
          for i in $(seq 1 120); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3456/ 2>/dev/null)
            if [ "$CODE" != "000" ]; then
              echo "Server responded with $CODE after ${i}s"
              break
            fi
            sleep 1
          done
          cd ..
          wget --recursive --page-requisites --adjust-extension --convert-links \
               --no-parent --timeout=30 --tries=3 \
               --directory-prefix=deploy-site \
               http://localhost:3456/ 2>&1 || true
          kill $MINT_PID 2>/dev/null || true
          mv deploy-site/localhost:3456/* deploy-site/ 2>/dev/null || true
          rm -rf deploy-site/localhost:3456 2>/dev/null || true
          echo "=== Downloaded files ==="
          find deploy-site -type f | wc -l
          ls deploy-site/ | head -10

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4