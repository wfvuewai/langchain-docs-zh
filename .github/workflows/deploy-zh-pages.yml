---
name: Deploy Chinese Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Install Mintlify CLI
        run: npm install -g mint@4.2.406

      - name: Install wget
        run: sudo apt-get update && sudo apt-get install -y wget

      - name: Build Chinese docs
        run: uv run python scripts/build_zh.py

      - name: Start Mintlify dev server and capture static site
        run: |
          cd build
          mint dev --port 3000 &
          MINT_PID=$!
          echo "Mintlify PID: $MINT_PID"
          sleep 15
          mkdir -p ../site
          cd ../site
          wget --mirror --page-requisites --adjust-extension --convert-links \
               --no-parent --wait=0.1 --limit-rate=500K \
               --directory-prefix=. \
               http://localhost:3000/ 2>&1 | tail -20
          kill $MINT_PID 2>/dev/null || true
          mv localhost:3000/* . 2>/dev/null || true
          find . -maxdepth 1 -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.json" | head -20

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4